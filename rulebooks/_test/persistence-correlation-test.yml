---
# SBX / CitiusCloud TEST ONLY. Do not merge into rulebooks/ used by DEV/UAT/PRD.
# Needs TWO events to fire: critical incident, then approval for the same incident.
# Matched on fixed INC0001 (cross-event joins crash this Drools build).
- name: persistence-correlation-test
  hosts: all
  sources:
    - name: test-webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: "{{ webhook_token }}"

  rules:
    - name: R900-IncidentThenApproval-LogCorrelated
      condition:
        all:
          - events.inc << event.payload.topic == "servmgt.incident" and event.payload.severity == "critical" and event.payload.id == "INC0001"
          - events.req << event.payload.topic == "servmgt.request" and event.payload.status == "approved" and event.payload.incident_id == "INC0001"
        timeout: 15 minutes
      action:
        debug:
          # In multi-event rules use events.<alias>, never event.
          msg: "CORRELATED incident {{ events.inc.payload.id }} + approval {{ events.req.payload.id }}"